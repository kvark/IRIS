[package]
name = "kindle"
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
repository = "https://github.com/kvark/kindle"
edition = "2024"
rust-version = "1.92"
description = "A live-learning Dreamer agent with frozen causal visual perception."
license = "MIT"

[dependencies]
# Latest main plus the two carried LeVJEPA cached-query-block patches.
meganeura = { git = "https://github.com/kvark/meganeura", rev = "4d45ba3a1830107769ae07fabcf3b95d0762973c" }
# Match Meganeura's published dependency so GPU context types stay identical.
blade-graphics = "=0.9.0"
rand = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
